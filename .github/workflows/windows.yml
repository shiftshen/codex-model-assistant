name: Windows

on:
  push:
    branches: [main]
    tags: ["v*-windows-preview*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned SQLite CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip"
          $expected = "f46ee2475de4cbe287e6e5f7d43c838796b14e7379cd216bdbb28d391429f9fc"
          $zip = Join-Path $env:RUNNER_TEMP "sqlite-tools-win-x64-3530400.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sqlite-tools"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SQLite SHA256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $sqlite = Get-ChildItem $extract -Recurse -Filter sqlite3.exe | Select-Object -First 1
          if (-not $sqlite) { throw "sqlite3.exe not found in official SQLite archive" }
          New-Item -ItemType Directory -Force .runtime-cache/windows | Out-Null
          Copy-Item $sqlite.FullName .runtime-cache/windows/sqlite3.exe
          .\.runtime-cache\windows\sqlite3.exe --version
      - name: Install dependencies
        run: npm ci
      - name: Node tests on Windows
        shell: powershell
        run: |
          $env:CMA_SQLITE3 = (Resolve-Path ".runtime-cache/windows/sqlite3.exe")
          $failed = @()
          Get-ChildItem tests -Filter "*.test.mjs" | Sort-Object Name | ForEach-Object {
            Write-Host ""
            Write-Host "=== Windows CI: $($_.Name) ==="
            Write-Host "::notice file=tests/$($_.Name),title=Windows test start::$($_.Name)"
            $output = @(& node --test --test-force-exit --test-timeout=45000 $_.FullName 2>&1)
            $output | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              $failed += $_.Name
              $tail = (($output | Select-Object -Last 20) -join " | ").Replace("%", "%25")
              Write-Host "::error file=tests/$($_.Name),title=Windows test failed: $($_.Name)::$tail"
            }
          }
          if ($failed.Count -gt 0) {
            throw "Windows tests failed: $($failed -join ', ')"
          }
      - name: Build Windows installers
        shell: powershell
        run: |
          $env:CMA_SQLITE3 = (Resolve-Path ".runtime-cache/windows/sqlite3.exe")
          npm run win:dist
      - name: Verify artifacts
        shell: powershell
        run: |
          Get-ChildItem release-windows
          $files = Get-ChildItem release-windows -Filter "*.exe"
          if ($files.Count -lt 2) { throw "Expected NSIS and portable exe artifacts" }
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Model-Assistant-Windows-x64
          path: release-windows/*.exe
          if-no-files-found: error
      - name: Publish preview release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --prerelease --title "Codex Model Assistant ${{ github.ref_name }}" --notes "Windows Preview: automated Windows x64 build. Core Node tests passed on windows-latest; real Microsoft Store/MSIX desktop behavior still requires user-machine validation."
          }
          gh release upload "${{ github.ref_name }}" release-windows/*.exe --clobber --repo "${{ github.repository }}"
