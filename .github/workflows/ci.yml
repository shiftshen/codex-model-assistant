name: CI

# 测试依赖 /usr/bin/sqlite3 和 df 的行为差异，所以必须跑在 macOS 上，不能用 ubuntu。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 确认依赖存在
        run: |
          node --version
          /usr/bin/sqlite3 --version
      - name: Node 回归测试
        run: npm test
      - name: 获取 Universal Node 运行时
        run: zsh scripts/fetch-runtime.sh
      - name: 构建 Universal macOS App
        run: zsh scripts/build-app.sh
      - name: 校验双架构、最低系统与签名
        run: |
          APP="build/Codex 模型助手.app"
          lipo -archs "$APP/Contents/MacOS/CodexModelAssistant" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/CodexModelAssistant" | grep -q x86_64
          /usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$APP/Contents/Info.plist" | grep -qx '12.0'
          codesign --verify --deep --strict "$APP"
